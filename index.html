<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - تطبيقي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h2>تسجيل الدخول</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-box">
                    <input type="text" id="loginUsername" required>
                    <label>الاسم الكامل أو رقم الهاتف</label>
                </div>
                <div class="input-box">
                    <input type="password" id="loginPassword" required minlength="4">
                    <label>كلمة المرور (4 أحرف على الأقل)</label>
                </div>
                <div class="forgot-pass">
                    <a href="forgot-password.html">نسيت كلمة المرور؟</a>
                </div>
                <button type="submit" class="btn">دخول</button>
                <div id="loginError" style="color: #ff6b6b; margin-top: 10px; display: none; font-size: 0.9rem;"></div>
                <div class="signup-link">
                    <a href="signup.html">إنشاء حساب جديد</a>
                </div>
            </form>
        </div>

        <span style="--i:0;"></span><span style="--i:1;"></span><span style="--i:2;"></span>
        <span style="--i:3;"></span><span style="--i:4;"></span><span style="--i:5;"></span>
        <span style="--i:6;"></span><span style="--i:7;"></span><span style="--i:8;"></span>
        <span style="--i:9;"></span><span style="--i:10;"></span><span style="--i:11;"></span>
        <span style="--i:12;"></span><span style="--i:13;"></span><span style="--i:14;"></span>
        <span style="--i:15;"></span><span style="--i:16;"></span><span style="--i:17;"></span>
        <span style="--i:18;"></span><span style="--i:19;"></span><span style="--i:20;"></span>
        <span style="--i:21;"></span><span style="--i:22;"></span><span style="--i:23;"></span>
        <span style="--i:24;"></span><span style="--i:25;"></span><span style="--i:26;"></span>
        <span style="--i:27;"></span><span style="--i:28;"></span><span style="--i:29;"></span>
        <span style="--i:30;"></span><span style="--i:31;"></span><span style="--i:32;"></span>
        <span style="--i:33;"></span><span style="--i:34;"></span><span style="--i:35;"></span>
        <span style="--i:36;"></span><span style="--i:37;"></span><span style="--i:38;"></span>
        <span style="--i:39;"></span><span style="--i:40;"></span><span style="--i:41;"></span>
        <span style="--i:42;"></span><span style="--i:43;"></span><span style="--i:44;"></span>
        <span style="--i:45;"></span><span style="--i:46;"></span><span style="--i:47;"></span>
        <span style="--i:48;"></span><span style="--i:49;"></span>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('loginError');
            
            const storedName = localStorage.getItem('userName');
            const storedPhone = localStorage.getItem('userPhone');
            const storedPassword = localStorage.getItem('userPassword');
            
            if (!storedName || !storedPassword) {
                errorDiv.textContent = '❌ لا يوجد حساب مسجل. يرجى إنشاء حساب أولاً.';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (password.length < 4) {
                errorDiv.textContent = '❌ كلمة المرور يجب أن تكون 4 أحرف على الأقل.';
                errorDiv.style.display = 'block';
                return;
            }
            
            const isNameValid = (username === storedName);
            const isPhoneValid = (username === storedPhone);
            const isPasswordValid = (password === storedPassword);
            
            if ((isNameValid || isPhoneValid) && isPasswordValid) {
                localStorage.setItem('loginTime', new Date().toLocaleString('ar-EG'));
                window.location.href = 'home.html';
            } else {
                errorDiv.textContent = '❌ اسم المستخدم أو كلمة المرور غير صحيحة.';
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
